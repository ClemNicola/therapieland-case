[project]
name = "api"
version = "0.1.0"
description = "Patient management API (Django + DRF)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.18,<3.19",
    "drf-spectacular>=0.30,<0.31",
    "gunicorn>=27,<28",
    "psycopg[binary]>=3.3,<3.4",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-django>=4.14",
    "ruff>=0.17",
]

[tool.uv]
# This is an application, not a library: don't build/install it as a package.
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works
